<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Data Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .table-container { overflow-x: auto; }
        th { position: sticky; top: 0; background-color: #f3f4f6; z-index: 10; }
    </style>
</head>
<body class="bg-gray-50 p-6 font-sans">
    <div class="w-full bg-white shadow-md rounded-lg overflow-hidden border border-gray-200">
        <!-- Top Navigation Bar -->
        <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-white">
            <h1 class="text-xl font-bold text-gray-800">📦 Final (Bids Dashboard)</h1>
            <div class="flex items-center space-x-4">
                <span id="user-status" class="text-sm text-gray-500 font-medium">Not Logged In</span>
                <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700 hover:underline hidden transition" id="logout-btn">Logout</button>
            </div>
        </div>

        <!-- Login Form Section -->
        <div id="login-section" class="p-12 max-w-sm mx-auto">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800">Authentication</h2>
                <p class="text-sm text-gray-500 mt-2">Restricted to admin@nbt.com only</p>
            </div>
            <input type="email" id="email" placeholder="Email (admin@nbt.com)" class="w-full mb-4 p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="password" placeholder="Password" class="w-full mb-6 p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" onkeydown="if(event.key === 'Enter') handleLogin()">
            <button onclick="handleLogin()" id="login-btn" class="w-full bg-blue-600 text-white py-3 rounded font-semibold hover:bg-blue-700 transition shadow-sm">
                Login Dashboard
            </button>
            <p id="login-error" class="text-red-500 text-sm mt-4 hidden text-center bg-red-50 p-2 rounded"></p>
        </div>

        <!-- Data Table Section (Hidden by default) -->
        <div id="data-section" class="table-container max-h-[800px] hidden">
            <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-end">
                <button onclick="fetchFinalData()" class="bg-gray-200 text-gray-700 px-4 py-2 rounded text-sm hover:bg-gray-300 transition shadow-sm">
                    Refresh Data
                </button>
            </div>
            <table class="min-w-full divide-y divide-gray-200 text-left text-sm whitespace-nowrap">
                <thead>
                    <tr>
                        <th class="px-4 py-3 font-semibold text-gray-600">Job ID</th>
                        <th class="px-4 py-3 font-semibold text-gray-600">Company Name</th>
                        <th class="px-4 py-3 font-semibold text-gray-600">Contact Person</th>
                        <th class="px-4 py-3 font-semibold text-gray-600">Source Location</th>
                        <th class="px-4 py-3 font-semibold text-gray-600">Item Desc</th>
                        <th class="px-4 py-3 font-semibold text-gray-600">Quantity</th>
                        <th class="px-4 py-3 font-semibold text-gray-600">Delivery Date</th>
                        <th class="px-4 py-3 font-semibold text-gray-600">Offered Price</th>
                        <th class="px-4 py-3 font-semibold text-gray-600">Remarks</th>
                        <th class="px-4 py-3 font-semibold text-gray-600">Status</th>
                        <th class="px-4 py-3 font-semibold text-gray-600">PO Number</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-gray-200 text-gray-700">
                    <!-- Data rows populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cqbuguapyeyshujhkvky.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxYnVndWFweWV5c2h1amhrdmt5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2OTI5NTQsImV4cCI6MjEwMDI2ODk1NH0.C2EuPMe1ijXCcgJ300iGs-yjyVOs4lC-TuwGu33WAsc'; 
        
        const mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        checkSession();

        async function checkSession() {
            const { data: { session } } = await mySupabase.auth.getSession();
            if (session) {
                // Double check session email as well
                if (session.user.email !== 'admin@nbt.com') {
                    await mySupabase.auth.signOut();
                    return;
                }
                showDataSection(session.user.email);
                fetchFinalData();
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');

            if (!email || !password) {
                errorEl.textContent = "Please enter email and password.";
                errorEl.classList.remove('hidden');
                return;
            }

            // RESTRICT LOGIN TO admin@nbt.com ONLY
            if (email !== 'admin@nbt.com') {
                errorEl.textContent = "Access denied: Only admin@nbt.com is permitted.";
                errorEl.classList.remove('hidden');
                return;
            }

            btn.textContent = "Logging in...";
            btn.disabled = true;

            const { data, error } = await mySupabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            btn.textContent = "Login Dashboard";
            btn.disabled = false;

            if (error) {
                errorEl.textContent = "Login failed: " + error.message;
                errorEl.classList.remove('hidden');
            } else {
                errorEl.classList.add('hidden');
                showDataSection(data.user.email);
                fetchFinalData(); 
            }
        }

        async function logout() {
            await mySupabase.auth.signOut();
            document.getElementById('data-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.add('hidden');
            document.getElementById('user-status').textContent = 'Not Logged In';
            document.getElementById('table-body').innerHTML = '';
            document.getElementById('password').value = '';
        }

        function showDataSection(email) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('data-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');
            document.getElementById('user-status').textContent = `Logged in: ${email}`;
            document.getElementById('table-body').innerHTML = `<tr><td colspan="11" class="px-4 py-12 text-center text-blue-500 font-semibold">Fetching latest data...</td></tr>`;
        }

        async function fetchFinalData() {
            try {
                const { data, error } = await mySupabase
                    .from('bids')
                    .select(`
                        id,
                        job_id,
                        status,
                        proposed_price,
                        jobs (
                            id,
                            source_loc,
                            item_desc,
                            quantity,
                            delivery_date,
                            offered_price,
                            remarks,
                            po_number
                        ),
                        transporters (
                            id,
                            company_name,
                            contact_person
                        )
                    `);

                if (error) throw error;
                renderTable(data);
            } catch (err) {
                console.error('Fetch data failed:', err);
                document.getElementById('table-body').innerHTML = `
                    <tr><td colspan="11" class="px-4 py-8 text-center text-red-500 bg-red-50">
                        <p class="font-bold">Load Failed</p>
                        <p class="text-sm mt-1">Please check F12 Console for details.</p>
                    </td></tr>
                `;
            }
        }

        function renderTable(rows) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (!rows || rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="px-4 py-12 text-center text-gray-500">No matching data found in database.</td></tr>`;
                return;
            }

            rows.forEach(row => {
                const job = row.jobs || {};
                const transporter = row.transporters || {};
                
                let statusBadge = `<span class="px-2 py-1 bg-gray-100 text-gray-600 rounded text-xs">${row.status || '-'}</span>`;
                if (row.status === 'accepted') {
                    statusBadge = `<span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs font-semibold">Accepted</span>`;
                } else if (row.status === 'submitted') {
                    statusBadge = `<span class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs">Submitted</span>`;
                }

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-blue-50 transition-colors border-b border-gray-100';
                
                tr.innerHTML = `
                    <td class="px-4 py-3 font-mono text-xs text-gray-500">${row.job_id ? row.job_id.split('-')[0] + '...' : '-'}</td>
                    <td class="px-4 py-3 font-semibold text-gray-800">${transporter.company_name || '-'}</td>
                    <td class="px-4 py-3 text-gray-600">${transporter.contact_person || '-'}</td>
                    <td class="px-4 py-3 text-gray-700">${job.source_loc || '-'}</td>
                    <td class="px-4 py-3 text-gray-600">${job.item_desc || '-'}</td>
                    <td class="px-4 py-3 text-gray-600">${job.quantity || '-'}</td>
                    <td class="px-4 py-3 text-gray-600">${job.delivery_date || '-'}</td>
                    <td class="px-4 py-3 text-gray-600">${job.offered_price ? 'RM ' + job.offered_price : '-'}</td>
                    <td class="px-4 py-3 text-xs text-gray-500 max-w-[150px] truncate" title="${job.remarks || ''}">${job.remarks || '-'}</td>
                    <td class="px-4 py-3">${statusBadge}</td>
                    <td class="px-4 py-3 font-mono text-gray-600">${job.po_number || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
